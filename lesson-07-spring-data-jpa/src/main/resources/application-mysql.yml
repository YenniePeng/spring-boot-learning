spring:
  datasource:
    url: ${MYSQL_DB_URL:jdbc:mysql://localhost:3306/data_jpa?createDatabaseIfNotExist=true}
    username: ${MYSQL_DB_USERNAME:root}
    password: ${MYSQL_DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: update
    database: mysql
    show-sql: true
