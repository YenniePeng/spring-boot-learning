spring:
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/data_jpa}
    username: ${DB_USERNAME:yennie}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: update
    database: postgresql
    show-sql: true
